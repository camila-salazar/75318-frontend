<div class="container">
  <div class="card">
    <div class="card-header">
      <div class="d-flex justify-content-between align-items-center">
        <h3>
          <i class="fa fa-user-md"></i>
          &nbsp;Especializaciones
        </h3>
        <!-- Botón abre modal -->
        <button class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#modalCrearEspecializacion">
          <i class="fa fa-plus"></i>
          Nueva especialización
        </button>
      </div>
    </div>

    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead>
            <tr>
              <th>Id</th>
              <th>Nombre</th>
              <th>Descripción</th>
              <th>Código</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let especializacion of especializaciones">
              <td>{{ especializacion.id }}</td>
              <td>{{ especializacion.nombre }}</td>
              <td>{{ especializacion.descripcion }}</td>
              <td>{{ especializacion.codigoEspecializacion }}</td>
            </tr>
          </tbody>
        </table>

        <!-- Mensaje si no hay datos -->
        <div *ngIf="especializaciones.length === 0" class="text-center text-muted mt-3">
          No hay especializaciones registradas.
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="modalCrearEspecializacion" tabindex="-1" aria-labelledby="modalCrearEspecializacionLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="modalCrearEspecializacionLabel">Nueva especialización</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        Contenido de ejemplo del modal.
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
      </div>
    </div>
  </div>
</div>
