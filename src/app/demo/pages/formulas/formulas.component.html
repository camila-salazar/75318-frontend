<div class="container">
  <div class="card">
    <div class="card-header">
      <div class="d-flex justify-content-between align-items-center">
        <h3>
          <i class="fa fa-pills"></i>
          &nbsp;Formulas medicas
        </h3>

        <button class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#modalCrearFormulas">
          <i class="fa fa-plus"></i>
          Nueva formula
        </button>
      </div>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead>
            <tr>
              <th>Id</th>
              <th>Cita</th>
              <th>Medicamento</th>
              <th>Dosis</th>
              <th>Indicaciones</th>
              <th>Fecha Creacion</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let formula of formulas">
              <td>{{ formula.id }}</td>
              <td>{{ formula.cita_id }}</td>
              <td>{{ formula.medicamento_id }}</td>
              <td>{{ formula.dosis }}</td>
              <td>{{ formula.indicaciones }}</td>
              <td>{{ formula.fecha_creacion_registro }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Modal de ejemplo -->
<div class="modal fade" id="modalCrearFormulas" tabindex="-1" aria-labelledby="modalCrearFormulasLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="modalCrearFormulasLabel">Nueva formula</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        Contenido de ejemplo del modal.
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
      </div>
    </div>
  </div>
</div>
