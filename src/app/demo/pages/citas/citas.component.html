<div class="container">
  <div class="card">
    <div class="card-header">
      <div class="d-flex justify-content-between align-items-center">
        <h3>
          <i class="fa fa-calendar"></i>
          &nbsp;Gestión de Citas
        </h3>
        <!-- Botón abre modal -->
        <button class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#modalCrearCita">
          <i class="fa fa-plus"></i>
          Nueva cita
        </button>
      </div>
    </div>

    <div class="card-body">
      <div class="table-responsive" *ngIf="citas.length > 0; else sinCitas">
        <table class="table table-striped table-hover">
          <thead>
            <tr>
              <th>Id</th>
              <th>Paciente</th>
              <th>Médico</th>
              <th>Motivo</th>
              <th>Fecha y hora</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let cita of citas">
              <td>{{ cita.id }}</td>
              <td>{{ cita.paciente_id }}</td>
              <td>{{ cita.medico_id }}</td>
              <td>{{ cita.motivo }}</td>
              <td>{{ cita.fecha_hora | date: 'short' }}</td>
              <td>{{ cita.estado }}</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Template mostrado si no hay citas -->
      <ng-template #sinCitas>
        <div class="alert alert-warning text-center m-3">
          No hay citas registradas.
        </div>
      </ng-template>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="modalCrearCita" tabindex="-1" aria-labelledby="modalCrearCitaLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="modalCrearCitaLabel">Nueva cita</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        Contenido del modal para registrar una nueva cita.
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
      </div>
    </div>
  </div>
</div>
